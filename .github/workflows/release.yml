name: Release

# Publishes @encorp.ai/llm-open-proxy to npm using **Trusted Publishing**
# (OIDC). No NPM_TOKEN secret required.
#
# Trigger: create a GitHub Release whose tag matches `v<semver>` (e.g. v0.1.1).
# The job verifies that the tag matches package.json `version` before publishing.
#
# One-time setup on npmjs.com (see PUBLISHING.md):
#   1. Org admin must approve the package under @encorp.ai.
#   2. On the package settings page → "Trusted Publisher" → add a GitHub
#      Actions publisher with:
#        Repository:        encorp-io/llm-open-proxy
#        Workflow filename: release.yml
#        Environment:       (leave blank, or set to "npm" if you add one)
#   3. After the first publish, provenance + Sigstore attestation appear
#      automatically on the npm page.
#
# Why Node 24, not 22:
#   Trusted Publishing requires npm >= 11.5.1. Node 22 ships npm 10.x, so
#   it would need a `npm install -g npm@latest` self-upgrade step, which
#   is a famously fragile dance (it partially removes the running npm
#   before installing the new one, causing MODULE_NOT_FOUND on internals
#   like `promise-retry` mid-install). Node 24 ships with npm 11.x out of
#   the box, so no self-upgrade is needed.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm version supports Trusted Publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm version: $NPM_VERSION"
          # Trusted Publishing was added in npm 11.5.1.
          node -e "
            const v = '$NPM_VERSION'.split('.').map(Number);
            if (v[0] < 11 || (v[0] === 11 && v[1] < 5) || (v[0] === 11 && v[1] === 5 && v[2] < 1)) {
              console.error('npm', '$NPM_VERSION', 'does not support Trusted Publishing — need >= 11.5.1');
              process.exit(1);
            }
          "

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No NODE_AUTH_TOKEN: Trusted Publishing exchanges the GitHub OIDC
      # token for a short-lived npm publish token automatically.
      - name: Publish to npm (Trusted Publishing + provenance)
        run: npm publish --provenance --access public
